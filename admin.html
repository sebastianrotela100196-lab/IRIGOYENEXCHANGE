<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Irigoyen Exchange Admin</title>


<style>


*{

box-sizing:border-box;

font-family:'Segoe UI',Arial,sans-serif;

}



body{


margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;


background:

radial-gradient(circle at top,#0b3d2b,#020504 60%);


color:white;


}



/* CONTENEDOR PRINCIPAL */


.container{


width:440px;

padding:35px;


background:

rgba(10,20,16,0.85);


border:1px solid #1c4938;


border-radius:25px;


backdrop-filter:blur(15px);


box-shadow:

0 0 50px rgba(0,255,120,.15);


}




/* LOGO */


.logo{


text-align:center;

margin-bottom:25px;


font-size:30px;

font-weight:800;


letter-spacing:1px;


}



.logo span{

color:#00d85a;

}



.subtitle{


text-align:center;

font-size:13px;

color:#8ca99c;

margin-top:-20px;

margin-bottom:30px;


}






/* TITULOS */


h2{


font-size:22px;

margin-bottom:20px;


}



h3{


margin-top:0;

display:flex;

align-items:center;

gap:10px;


}






/* INPUTS */


input{


width:100%;


padding:15px;


margin:10px 0;


background:#050807;


border:1px solid #26483a;


border-radius:12px;


color:white;


font-size:16px;


outline:none;


transition:.3s;


}




input:focus{


border-color:#00d85a;


box-shadow:0 0 12px #00d85a55;


}







/* BOTONES */


button{


width:100%;


padding:15px;


border:none;


border-radius:12px;


background:#00a94f;


color:white;


font-weight:bold;


font-size:15px;


cursor:pointer;


margin-top:15px;


transition:.3s;


}



button:hover{


background:#00d85a;


transform:translateY(-2px);


}



.loading{


opacity:.6;

cursor:not-allowed;


}







/* LOGIN */


#panel{


display:none;


}







/* TARJETAS */


.card{


background:

linear-gradient(

145deg,

#08140f,

#050807

);


border:1px solid #17392b;


padding:20px;


border-radius:18px;


margin-top:18px;


box-shadow:

inset 0 0 20px #00ff8810;


}






.icon{


font-size:25px;

}






/* ESTADO */


.info{


margin-top:15px;


font-size:14px;


color:#00d85a;


text-align:center;


}






/* BOTON SALIR */


.logout{


background:#c62828;


}


.logout:hover{


background:#e53935;


}






/* TOAST */


.toast{


position:fixed;


bottom:30px;


left:50%;


transform:

translateX(-50%)

translateY(100px);



background:#00b94f;


padding:15px 25px;


border-radius:15px;


font-weight:bold;


opacity:0;


transition:.4s;


box-shadow:

0 0 30px #00ff8866;


}



.toast.show{


opacity:1;


transform:

translateX(-50%)

translateY(0);


}






/* INDICADOR */


.connection{


text-align:center;


font-size:12px;


color:#00d85a;


margin-bottom:15px;


}



</style>


</head>



<body>



<div class="container">



<div class="logo">

IRIGOYEN <span>EXCHANGE</span>

</div>



<div class="subtitle">

Digital Asset Management

</div>
<!-- ==========================
LOGIN ADMIN
========================== -->


<div id="login">


<h2>
🔐 Administrador
</h2>



<input 
id="email"
type="email"
placeholder="Correo electrónico">



<input
id="password"
type="password"
placeholder="Contraseña">



<button id="btnLogin">

INGRESAR

</button>



<p id="mensaje"></p>



</div>







<!-- ==========================
PANEL CONTROL
========================== -->


<div id="panel">



<div class="connection">

🟢 Firebase conectado

</div>





<h2>

Panel de Control

</h2>






<!-- USDT -->


<div class="card">


<h3>

<span class="icon">
🟢
</span>

USDT - Tether

</h3>



<label>

Compra (Gs.)

</label>


<input 
id="usdtCompra"
placeholder="Compra">



<label>

Venta (Gs.)

</label>


<input 
id="usdtVenta"
placeholder="Venta">



</div>









<!-- USD -->


<div class="card">


<h3>


<span class="icon">

💵

</span>


USD / PYG

</h3>



<label>

Compra (Gs.)

</label>


<input

id="usdCompra"

placeholder="Compra">





<label>

Venta (Gs.)

</label>


<input

id="usdVenta"

placeholder="Venta">



</div>









<!-- CRYPTO -->


<div class="card">


<h3>


<span class="icon">

₿

</span>


Configuración Crypto

</h3>




<p style="color:#8ca99c;font-size:13px">

Margen automático aplicado a Binance

</p>




<label>

Margen compra (%)

</label>



<input

id="margenCompra"

placeholder="Ejemplo: 1.5">





<label>

Margen venta (%)

</label>



<input

id="margenVenta"

placeholder="Ejemplo: 2">





</div>








<p class="info" id="estado">

Cargando cotizaciones...

</p>







<button id="guardar">

💾 GUARDAR CAMBIOS

</button>






<button class="logout" id="logout">

🚪 CERRAR SESIÓN

</button>






</div>







<!-- MENSAJE GUARDADO -->


<div id="toast" class="toast">

✅ Cambios guardados correctamente

</div>

<script type="module">


import {

getAuth,

signInWithEmailAndPassword,

signOut

}

from

"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";





import {

app,

obtenerCotizacionesAdmin,

actualizarCotizacion,

obtenerMargenesCrypto,

actualizarMargenesCrypto

}

from "./firebase-config.js";






const auth = getAuth(app);



const login = document.getElementById("login");

const panel = document.getElementById("panel");






// =============================
// LOGIN
// =============================


document
.getElementById("btnLogin")
.onclick = async()=>{


const email =

document.getElementById("email").value;



const password =

document.getElementById("password").value;





try{


await signInWithEmailAndPassword(

auth,

email,

password

);





login.style.display="none";


panel.style.display="block";





cargarCotizaciones();



}



catch(error){



document.getElementById("mensaje").innerHTML =

"❌ Datos incorrectos";



}



};









// =============================
// CARGAR DATOS FIREBASE
// =============================


async function cargarCotizaciones(){


try{



const datos = await obtenerCotizacionesAdmin();





// USDT


if(datos.USDT){


document.getElementById("usdtCompra").value =

datos.USDT.compra;



document.getElementById("usdtVenta").value =

datos.USDT.venta;



}







// USD


if(datos.USD){


document.getElementById("usdCompra").value =

datos.USD.compra;



document.getElementById("usdVenta").value =

datos.USD.venta;



}








// MARGENES CRYPTO


const crypto = await obtenerMargenesCrypto();



if(crypto){


document.getElementById("margenCompra").value =

crypto.margenCompra;



document.getElementById("margenVenta").value =

crypto.margenVenta;



}







document.getElementById("estado").innerHTML =

"🟢 Cotizaciones cargadas correctamente";



}



catch(error){


console.log(error);



document.getElementById("estado").innerHTML =

"🔴 Error cargando datos";



}



}









// =============================
// GUARDAR TODO
// =============================


document
.getElementById("guardar")
.onclick = async()=>{





const boton =

document.getElementById("guardar");





boton.innerHTML =

"⏳ ACTUALIZANDO...";





boton.classList.add("loading");


boton.disabled=true;






const usdtCompra =

document.getElementById("usdtCompra").value;



const usdtVenta =

document.getElementById("usdtVenta").value;






const usdCompra =

document.getElementById("usdCompra").value;



const usdVenta =

document.getElementById("usdVenta").value;







const margenCompra =

document.getElementById("margenCompra").value;



const margenVenta =

document.getElementById("margenVenta").value;








try{





// ACTUALIZA USDT


await actualizarCotizacion(

"USDT",

usdtCompra,

usdtVenta

);








// ACTUALIZA USD


await actualizarCotizacion(

"USD",

usdCompra,

usdVenta

);








// ACTUALIZA CRYPTO


await actualizarMargenesCrypto(

margenCompra,

margenVenta

);








document.getElementById("estado").innerHTML =

"🟢 Cambios actualizados correctamente";







// MOSTRAR TOAST


const toast =

document.getElementById("toast");



toast.classList.add("show");





setTimeout(()=>{


toast.classList.remove("show");


},3000);






}





catch(error){



console.log(error);



document.getElementById("estado").innerHTML =

"🔴 Error guardando cambios";



}







boton.innerHTML =

"💾 GUARDAR CAMBIOS";



boton.classList.remove("loading");


boton.disabled=false;




};









// =============================
// CERRAR SESIÓN
// =============================


document
.getElementById("logout")
.onclick = ()=>{


signOut(auth);


location.reload();



};



</script>



</body>

</html>
